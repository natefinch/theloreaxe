<script>
(function() {
  // Convert [[Card Name]] to hoverable card references
  var containers = document.querySelectorAll('.post-body, .project-body, .single-post, .content');
  containers.forEach(function(el) {
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(node) {
      if (!node.textContent.includes('[[')) return;
      var parts = node.textContent.split(/\[\[([^\]]+)\]\]/g);
      if (parts.length < 2) return;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < parts.length; i++) {
        if (i % 2 === 0) {
          if (parts[i]) frag.appendChild(document.createTextNode(parts[i]));
        } else {
          var span = document.createElement('span');
          span.className = 'card-ref';
          span.setAttribute('data-card', parts[i]);
          span.textContent = parts[i];
          frag.appendChild(span);
        }
      }
      node.parentNode.replaceChild(frag, node);
    });
  });

  // Hover tooltip for .card-ref elements
  var tip = null;
  var cache = {};

  function createTooltip() {
    if (tip) return tip;
    tip = document.createElement('div');
    tip.className = 'card-tooltip';
    tip.innerHTML = '<img alt="">';
    document.body.appendChild(tip);
    return tip;
  }

  function positionTooltip(e) {
    if (!tip) return;
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var tw = 260;
    var th = 364;
    var x = e.clientX + 16;
    var y = e.clientY + 16;
    if (x + tw > vw) x = e.clientX - tw - 16;
    if (y + th > vh) y = vh - th - 8;
    if (y < 8) y = 8;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  document.addEventListener('mouseover', function(e) {
    var ref = e.target.closest('.card-ref');
    if (!ref) return;
    var name = ref.getAttribute('data-card');
    if (!name) return;
    var t = createTooltip();
    var img = t.querySelector('img');
    var url = 'https://api.scryfall.com/cards/named?exact='
      + encodeURIComponent(name) + '&format=image&version=normal';
    img.alt = name;
    if (cache[name]) {
      img.src = cache[name];
    } else {
      img.src = url;
      img.onload = function() { cache[name] = img.src; };
    }
    positionTooltip(e);
    t.classList.add('visible');
  });

  document.addEventListener('mousemove', function(e) {
    if (tip && tip.classList.contains('visible')) positionTooltip(e);
  });

  document.addEventListener('mouseout', function(e) {
    var ref = e.target.closest('.card-ref');
    if (!ref) return;
    if (tip) tip.classList.remove('visible');
  });
})();
</script>
<script>
(function() {
  var dataEl = document.getElementById('decklist-data');
  if (!dataEl) return;

  var raw;
  try { raw = JSON.parse(dataEl.textContent); } catch(e) { return; }

  var commanderEl = document.getElementById('decklist-commander');
  var bodyEl = document.getElementById('decklist-body');
  var container = document.getElementById('decklist');
  var currentView = 'list';
  var TYPE_ORDER = ['Battle','Planeswalker','Creature','Sorcery','Instant','Artifact','Enchantment','Land'];

  // View toggle
  container.querySelectorAll('.decklist-view-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      currentView = btn.getAttribute('data-view');
      container.querySelectorAll('.decklist-view-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      bodyEl.setAttribute('data-view', currentView);
    });
  });

  // Parse "1 Card Name (SET) 123" or "Card Name (SET) 123"
  function parseLine(line) {
    line = line.trim();
    if (!line) return null;
    var m = line.match(/^(\d+)\s+(.+?)\s+\(([^)]+)\)\s+(.+)$/);
    if (m) return { qty: parseInt(m[1]), name: m[2], set: m[3].toLowerCase(), cn: m[4] };
    m = line.match(/^(.+?)\s+\(([^)]+)\)\s+(.+)$/);
    if (m) return { qty: 1, name: m[1], set: m[2].toLowerCase(), cn: m[3] };
    return null;
  }

  var cardLines = (Array.isArray(raw.cards) ? raw.cards : (raw.cards || '').split('\n')).map(parseLine).filter(Boolean);
  var commanders = [];
  if (raw.commander) {
    var cmd = parseLine('1 ' + raw.commander);
    if (cmd) commanders.push(cmd);
  }
  if (raw.partner) {
    var prt = parseLine('1 ' + raw.partner);
    if (prt) commanders.push(prt);
  }

  // Build Scryfall collection identifiers
  var allCards = commanders.concat(cardLines);
  var identifiers = allCards.map(function(c) {
    return { set: c.set, collector_number: c.cn };
  });

  // Scryfall collection API: max 75 per request
  function fetchCollection(ids) {
    var batches = [];
    for (var i = 0; i < ids.length; i += 75) {
      batches.push(ids.slice(i, i + 75));
    }
    return Promise.all(batches.map(function(batch) {
      return fetch('https://api.scryfall.com/cards/collection', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identifiers: batch })
      }).then(function(r) { return r.json(); });
    })).then(function(results) {
      var cards = [];
      results.forEach(function(r) {
        if (r.data) cards = cards.concat(r.data);
      });
      return cards;
    });
  }

  function scryfallImageUrl(card) {
    if (card.image_uris && card.image_uris.normal) return card.image_uris.normal;
    if (card.card_faces && card.card_faces[0] && card.card_faces[0].image_uris) {
      return card.card_faces[0].image_uris.normal;
    }
    return '';
  }

  function categorizeCard(typeLine) {
    var tl = (typeLine || '').toLowerCase();
    for (var i = 0; i < TYPE_ORDER.length; i++) {
      if (tl.includes(TYPE_ORDER[i].toLowerCase())) return TYPE_ORDER[i];
    }
    return 'Other';
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function frontName(name) {
    var idx = name.indexOf(' // ');
    return idx > -1 ? name.substring(0, idx) : name;
  }

  function renderManaCost(manaCost) {
    if (!manaCost) return '';
    var symbols = manaCost.match(/\{([^}]+)\}/g) || [];
    return symbols.map(function(sym) {
      var s = sym.replace(/[{}]/g, '').toUpperCase();
      // mana-font uses ms-{symbol} classes, lowercased
      var code = s.toLowerCase().replace('/', '');
      return '<i class="ms ms-cost ms-shadow ms-' + code + '" aria-hidden="true"></i>';
    }).join('');
  }

  function buildLookup(scryfallCards) {
    var lookup = {};
    scryfallCards.forEach(function(sc) {
      lookup[sc.set + '|' + sc.collector_number] = sc;
    });
    return lookup;
  }

  function render(scryfallCards) {
    var lookup = buildLookup(scryfallCards);

    // Render commanders
    var cmdHtml = '';
    commanders.forEach(function(c) {
      var sc = lookup[c.set + '|' + c.cn];
      var name = sc ? sc.name : c.name;
      var imgUrl = sc ? scryfallImageUrl(sc) : '';
      cmdHtml += '<div style="display:inline-block;margin:0 8px;">';
      if (imgUrl) cmdHtml += '<img src="' + imgUrl + '" alt="' + escapeHtml(name) + '" loading="lazy">';
      cmdHtml += '<p class="decklist-commander-name">' + escapeHtml(name) + '</p>';
      cmdHtml += '</div>';
    });
    commanderEl.innerHTML = cmdHtml;

    // Enrich mainboard cards
    var enriched = cardLines.map(function(c) {
      var sc = lookup[c.set + '|' + c.cn];
      return {
        name: sc ? sc.name : c.name,
        qty: c.qty,
        manaCost: sc ? (sc.mana_cost || (sc.card_faces && sc.card_faces[0] ? sc.card_faces[0].mana_cost : '') || '') : '',
        cmc: sc ? (sc.cmc || 0) : 0,
        typeLine: sc ? (sc.type_line || '') : '',
        category: sc ? categorizeCard(sc.type_line) : 'Other',
        imageUrl: sc ? scryfallImageUrl(sc) : ''
      };
    });

    // Group by category
    var groups = {};
    TYPE_ORDER.concat(['Other']).forEach(function(t) { groups[t] = []; });
    enriched.forEach(function(c) {
      if (!groups[c.category]) groups[c.category] = [];
      groups[c.category].push(c);
    });

    Object.keys(groups).forEach(function(cat) {
      groups[cat].sort(function(a, b) {
        if (a.cmc !== b.cmc) return a.cmc - b.cmc;
        return a.name.localeCompare(b.name);
      });
    });

    var html = '';
    TYPE_ORDER.concat(['Other']).forEach(function(cat) {
      var group = groups[cat];
      if (!group || group.length === 0) return;
      var totalCards = group.reduce(function(sum, c) { return sum + c.qty; }, 0);

      html += '<div class="decklist-group">';
      html += '<div class="decklist-group-header">' + cat;
      html += ' <span class="decklist-group-count">(' + totalCards + ')</span></div>';

      html += '<ul class="decklist-list">';
      group.forEach(function(c) {
        var displayName = frontName(c.name);
        html += '<li class="decklist-list-item">';
        html += '<span class="decklist-qty">' + c.qty + '</span>';
        html += '<span class="decklist-card-name card-ref" data-card="' + escapeHtml(c.name) + '">' + escapeHtml(displayName) + '</span>';
        html += '<span class="decklist-mana">' + renderManaCost(c.manaCost) + '</span>';
        html += '</li>';
      });
      html += '</ul>';

      html += '<div class="decklist-visual">';
      group.forEach(function(c) {
        for (var i = 0; i < c.qty; i++) {
          html += '<div class="decklist-visual-card">';
          if (c.imageUrl) html += '<img src="' + c.imageUrl + '" alt="' + escapeHtml(c.name) + '" loading="lazy">';
          html += '</div>';
        }
      });
      html += '</div>';

      html += '</div>';
    });

    bodyEl.innerHTML = html;
    bodyEl.setAttribute('data-view', currentView);
  }

  fetchCollection(identifiers)
    .then(render)
    .catch(function(err) {
      console.warn('Could not load card data:', err);
      bodyEl.innerHTML = '<p class="decklist-error">Could not load card data from Scryfall.</p>';
    });
})();
</script>
