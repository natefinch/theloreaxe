<script>
(function() {
  // Convert [[Card Name]] to hoverable card references
  var containers = document.querySelectorAll('.post-body, .project-body, .single-post, .content');
  containers.forEach(function(el) {
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(node) {
      if (!node.textContent.includes('[[')) return;
      var parts = node.textContent.split(/\[\[([^\]]+)\]\]/g);
      if (parts.length < 2) return;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < parts.length; i++) {
        if (i % 2 === 0) {
          if (parts[i]) frag.appendChild(document.createTextNode(parts[i]));
        } else {
          var span = document.createElement('span');
          span.className = 'card-ref';
          span.setAttribute('data-card', parts[i]);
          span.textContent = parts[i];
          frag.appendChild(span);
        }
      }
      node.parentNode.replaceChild(frag, node);
    });
  });

  // Hover tooltip for .card-ref elements
  var tip = null;
  var cache = {};

  function createTooltip() {
    if (tip) return tip;
    tip = document.createElement('div');
    tip.className = 'card-tooltip';
    tip.innerHTML = '<img alt="">';
    document.body.appendChild(tip);
    return tip;
  }

  function positionTooltip(e) {
    if (!tip) return;
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var tw = 260;
    var th = 364;
    var x = e.clientX + 16;
    var y = e.clientY + 16;
    if (x + tw > vw) x = e.clientX - tw - 16;
    if (y + th > vh) y = vh - th - 8;
    if (y < 8) y = 8;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  document.addEventListener('mouseover', function(e) {
    var ref = e.target.closest('.card-ref');
    if (!ref) return;
    var name = ref.getAttribute('data-card');
    if (!name) return;
    var t = createTooltip();
    var img = t.querySelector('img');
    var url = 'https://api.scryfall.com/cards/named?exact='
      + encodeURIComponent(name) + '&format=image&version=normal';
    img.alt = name;
    if (cache[name]) {
      img.src = cache[name];
    } else {
      img.src = url;
      img.onload = function() { cache[name] = img.src; };
    }
    positionTooltip(e);
    t.classList.add('visible');
  });

  document.addEventListener('mousemove', function(e) {
    if (tip && tip.classList.contains('visible')) positionTooltip(e);
  });

  document.addEventListener('mouseout', function(e) {
    var ref = e.target.closest('.card-ref');
    if (!ref) return;
    if (tip) tip.classList.remove('visible');
  });
})();
</script>
<script>
(function() {
  var container = document.querySelector('.decklist-container');
  if (!container) return;

  var deckUrl = container.getAttribute('data-deck-url');
  if (!deckUrl) return;

  var match = deckUrl.match(/\/decks\/([^/?#]+)/);
  if (!match) return;
  var deckId = match[1];

  var commanderEl = document.getElementById('decklist-commander');
  var bodyEl = document.getElementById('decklist-body');
  var currentView = 'list';
  var TYPE_ORDER = ['Battle', 'Planeswalker', 'Creature', 'Sorcery', 'Instant', 'Artifact', 'Enchantment', 'Land'];

  var viewBtns = container.querySelectorAll('.decklist-view-btn');
  viewBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      currentView = btn.getAttribute('data-view');
      viewBtns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      bodyEl.setAttribute('data-view', currentView);
    });
  });

  function categorizeCard(card) {
    var typeLine = (card.type_line || '').toLowerCase();
    for (var i = 0; i < TYPE_ORDER.length; i++) {
      if (typeLine.includes(TYPE_ORDER[i].toLowerCase())) return TYPE_ORDER[i];
    }
    return 'Other';
  }

  function scryfallImageUrl(name) {
    return 'https://api.scryfall.com/cards/named?exact=' + encodeURIComponent(name) + '&format=image&version=normal';
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderManaCost(manaCost) {
    if (!manaCost) return '';
    var symbols = manaCost.match(/\{([^}]+)\}/g) || [];
    return symbols.map(function(sym) {
      var s = sym.replace(/[{}]/g, '').toUpperCase();
      var cls = 'mana-sym ';
      if (s === 'W') cls += 'mana-w';
      else if (s === 'U') cls += 'mana-u';
      else if (s === 'B') cls += 'mana-b';
      else if (s === 'R') cls += 'mana-r';
      else if (s === 'G') cls += 'mana-g';
      else if (s === 'C') cls += 'mana-c';
      else if (s === 'X') cls += 'mana-x';
      else cls += 'mana-generic';
      return '<span class="' + cls + '">' + s + '</span>';
    }).join('');
  }

  function normalizeBoard(board) {
    var cards = [];
    Object.keys(board || {}).forEach(function(key) {
      var entry = board[key] || {};
      var card = entry.card || {};
      cards.push({
        name: card.name || '',
        qty: entry.quantity || 0,
        manaCost: card.mana_cost || '',
        cmc: card.cmc || 0,
        typeLine: card.type_line || '',
        category: categorizeCard(card)
      });
    });
    return cards;
  }

  function renderDecklist(data) {
    var commanders = data.commanders || {};
    var cmdHtml = '';
    Object.keys(commanders).forEach(function(key) {
      var entry = commanders[key] || {};
      var card = entry.card || {};
      if (!card.name) return;
      var safeCommanderName = escapeHtml(card.name);
      cmdHtml += '<div style="display:inline-block;margin:0 8px;">';
      cmdHtml += '<img src="' + scryfallImageUrl(card.name) + '" alt="' + safeCommanderName + '" loading="lazy">';
      cmdHtml += '<p class="decklist-commander-name">' + safeCommanderName + '</p>';
      cmdHtml += '</div>';
    });
    commanderEl.innerHTML = cmdHtml;

    var cards = normalizeBoard(data.mainboard);
    var groups = {};
    TYPE_ORDER.concat(['Other']).forEach(function(type) { groups[type] = []; });
    cards.forEach(function(card) {
      if (!groups[card.category]) groups[card.category] = [];
      groups[card.category].push(card);
    });

    Object.keys(groups).forEach(function(category) {
      groups[category].sort(function(a, b) {
        if (a.cmc !== b.cmc) return a.cmc - b.cmc;
        return a.name.localeCompare(b.name);
      });
    });

    var html = '';
    TYPE_ORDER.concat(['Other']).forEach(function(category) {
      var group = groups[category];
      if (!group || group.length === 0) return;

      var totalCards = group.reduce(function(sum, card) { return sum + card.qty; }, 0);
      html += '<div class="decklist-group">';
      html += '<div class="decklist-group-header">' + category;
      html += ' <span class="decklist-group-count">(' + totalCards + ')</span></div>';

      html += '<ul class="decklist-list">';
      group.forEach(function(card) {
        var safeCardName = escapeHtml(card.name);
        html += '<li class="decklist-list-item card-ref-wrap">';
        html += '<span class="decklist-qty">' + card.qty + '</span>';
        html += '<span class="decklist-card-name card-ref" data-card="' + safeCardName + '">' + safeCardName + '</span>';
        html += '<span class="decklist-mana">' + renderManaCost(card.manaCost) + '</span>';
        html += '</li>';
      });
      html += '</ul>';

      html += '<div class="decklist-visual">';
      group.forEach(function(card) {
        var safeCardName = escapeHtml(card.name);
        for (var i = 0; i < card.qty; i++) {
          html += '<div class="decklist-visual-card">';
          html += '<img src="' + scryfallImageUrl(card.name) + '" alt="' + safeCardName + '" loading="lazy">';
          html += '</div>';
        }
      });
      html += '</div>';
      html += '</div>';
    });

    bodyEl.innerHTML = html;
    bodyEl.setAttribute('data-view', currentView);
  }

  // Try local cached data first, then fall back to Moxfield API
  var localUrl = '/decks/' + deckId + '.json';
  var apiUrl = 'https://api2.moxfield.com/v3/decks/all/' + deckId;

  fetch(localUrl)
    .then(function(res) {
      if (!res.ok) throw new Error('No local data');
      return res.json();
    })
    .then(renderDecklist)
    .catch(function() {
      // Fall back to Moxfield API (may be blocked by CORS)
      fetch(apiUrl)
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(renderDecklist)
        .catch(function(err) {
          console.warn('Could not load decklist:', err);
          bodyEl.innerHTML = '<p class="decklist-error">Could not load decklist automatically. <a href="' + deckUrl + '" target="_blank" rel="noopener">View it on Moxfield →</a></p>';
        });
    });
})();
</script>
