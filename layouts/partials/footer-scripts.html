<script>
(function() {
  // Decklist toggle (mobile)
  var toggle = document.getElementById('decklist-toggle');
  if (toggle) {
    // Start collapsed on mobile
    if (window.innerWidth <= 920) {
      toggle.setAttribute('aria-expanded', 'false');
    }
    toggle.addEventListener('click', function() {
      var expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
    });
  }

  // Theme toggle
  (function initTheme() {
    var stored = localStorage.getItem('theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = stored || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);

    document.querySelectorAll('.theme-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    });
  })();

  // Sticky header on scroll
  var banner = document.getElementById('top');
  var sticky = document.getElementById('sticky-header');
  if (banner && sticky) {
    var shown = false;
    window.addEventListener('scroll', function() {
      var gone = banner.getBoundingClientRect().bottom < 0;
      if (gone && !shown) { sticky.classList.add('visible'); shown = true; }
      else if (!gone && shown) { sticky.classList.remove('visible'); shown = false; }
    }, { passive: true });
  }

  // Convert [[Card Name]] to hoverable card references
  var containers = document.querySelectorAll('.post-body, .project-body, .single-post, .content');
  containers.forEach(function(el) {
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(node) {
      if (!node.textContent.includes('[[')) return;
      var parts = node.textContent.split(/\[\[([^\]]+)\]\]/g);
      if (parts.length < 2) return;
      var frag = document.createDocumentFragment();
      for (var i = 0; i < parts.length; i++) {
        if (i % 2 === 0) {
          if (parts[i]) frag.appendChild(document.createTextNode(parts[i]));
        } else {
          var span = document.createElement('span');
          span.className = 'card-ref';
          span.setAttribute('data-card', parts[i]);
          span.textContent = parts[i];
          frag.appendChild(span);
        }
      }
      node.parentNode.replaceChild(frag, node);
    });
  });

  // Hover tooltip for .card-ref elements
  var tip = null;
  var cache = {};

  function createTooltip() {
    if (tip) return tip;
    tip = document.createElement('div');
    tip.className = 'card-tooltip';
    document.body.appendChild(tip);
    return tip;
  }

  function positionTooltip(e) {
    if (!tip) return;
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var tw = tip.offsetWidth || 260;
    var th = tip.offsetHeight || 364;
    var x = e.clientX + 16;
    var y = e.clientY + 16;
    if (x + tw > vw) x = e.clientX - tw - 16;
    if (y + th > vh) y = vh - th - 8;
    if (y < 8) y = 8;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  function showCard(name) {
    var t = createTooltip();
    if (cache[name]) {
      t.innerHTML = cache[name];
      return;
    }
    t.innerHTML = '<img alt="' + name + '" style="width:244px;opacity:0.3" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">';

    // Fetch card JSON to check for faces
    var url = 'https://api.scryfall.com/cards/named?exact=' + encodeURIComponent(name);
    fetch(url).then(function(r) {
      if (!r.ok) {
        // Try front name only
        var front = name.split(/\s*\/\/?\s*/)[0];
        if (front !== name) return fetch('https://api.scryfall.com/cards/named?exact=' + encodeURIComponent(front));
        throw new Error('not found');
      }
      return r;
    }).then(function(r) { return r.json(); }).then(function(card) {
      var html = '';
      if (card.card_faces && card.card_faces.length > 1 && card.card_faces[0].image_uris) {
        // DFC: show both faces side by side
        html = '<div class="card-tooltip-faces">';
        card.card_faces.forEach(function(face) {
          if (face.image_uris && face.image_uris.normal) {
            html += '<img src="' + face.image_uris.normal + '" alt="' + (face.name || '') + '">';
          }
        });
        html += '</div>';
      } else if (card.image_uris && card.image_uris.normal) {
        html = '<img src="' + card.image_uris.normal + '" alt="' + card.name + '">';
      }
      cache[name] = html;
      t.innerHTML = html;
    }).catch(function() {
      // Last resort: direct image URL
      var fallback = 'https://api.scryfall.com/cards/named?exact=' + encodeURIComponent(name.split(/\s*\/\/?\s*/)[0]) + '&format=image&version=normal';
      var html = '<img src="' + fallback + '" alt="' + name + '">';
      cache[name] = html;
      t.innerHTML = html;
    });
  }

  document.addEventListener('mouseover', function(e) {
    var ref = e.target.closest('.card-ref');
    if (!ref) return;
    var name = ref.getAttribute('data-card');
    if (!name) return;
    var t = createTooltip();
    showCard(name);
    positionTooltip(e);
    t.classList.add('visible');
  });

  document.addEventListener('mousemove', function(e) {
    if (tip && tip.classList.contains('visible')) positionTooltip(e);
  });

  document.addEventListener('mouseout', function(e) {
    var ref = e.target.closest('.card-ref');
    if (!ref) return;
    if (tip) tip.classList.remove('visible');
  });
})();
</script>
