{{ define "main" }}
<article class="single-post">
  <h1>{{ .Title }}</h1>
  <div class="post-meta">
    <span class="date">{{ .Date.Format "January 2, 2006" }}</span>
    {{ if .Params.tags }}
    <div class="tags" aria-label="Tags">
      {{ range .Params.tags }}
      <span class="tag">{{ . }}</span>
      {{ end }}
    </div>
    {{ end }}
  </div>
  {{ if .Params.cards }}
  {{ end }}
  <div class="post-body">
    {{ .Content }}
  </div>
</article>

<footer>
  <p>{{ .Site.Params.disclaimer | safeHTML }}</p>
  <p>© {{ now.Year }} {{ .Site.Title }}</p>
</footer>
{{ end }}
