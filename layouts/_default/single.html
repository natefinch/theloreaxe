{{ define "main" }}
<article class="project-page">
  <div class="project-header">
    {{ with .Params.icon }}
    <div class="project-page-icon">
      <img src="{{ . }}" alt="{{ $.Title }} icon">
    </div>
    {{ end }}
    <h1>{{ .Title }}</h1>
  </div>
  <div class="project-body">
    {{ .Content }}
  </div>
</article>

<footer>
  <p>{{ .Site.Params.disclaimer | safeHTML }}</p>
  <p>© {{ now.Year }} {{ .Site.Title }}</p>
</footer>
{{ end }}
